spring.application.name=muras-interactive

# --- PostgreSQL (база muras должна быть создана заранее) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/muras
spring.datasource.username=postgres
# Пароль берётся из переменной DB_PASSWORD, а если её нет - используется то, что после двоеточия
spring.datasource.password=${DB_PASSWORD}

# --- JPA: таблицы создаются/обновляются автоматически по сущностям ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# --- Сессия (cookie входа) ---
server.servlet.session.cookie.same-site=lax

# --- Адрес сайта (для ссылок в письмах) ---
app.frontend-url=${FRONTEND_URL:http://localhost:8443}

# --- Почта для восстановления пароля ---
# По умолчанию почта ВЫКЛЮЧЕНА: ссылка для сброса пароля печатается в консоль сервера.
# Чтобы отправлять настоящие письма, задайте переменные MAIL_ENABLED=true, MAIL_USERNAME, MAIL_PASSWORD
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_USERNAME:noreply@muras.local}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
