spring.application.name=muras-interactive

# --- PostgreSQL (база muras должна быть создана заранее) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/muras
spring.datasource.username=postgres
# Пароль берётся из переменной DB_PASSWORD, а если её нет - используется то, что после двоеточия
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA: таблицы создаются/обновляются автоматически по сущностям ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
